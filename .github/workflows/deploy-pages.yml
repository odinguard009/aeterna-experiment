# Deploys the built single-file game (index.html) to Cloudflare Pages after a green CI on main,
# and by hand via "Run workflow". index.html is self-contained and is already verified by CI
# ("index.html is the build of its sources"), so the committed file is deployed as-is.
# The first run creates the Pages project "aeterna-experiment" (idempotent create step below).
# Owner setup once: add the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; see docs/ai/online-hosting.md.
name: Deploy Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-pages
  cancel-in-progress: false
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stage the deploy directory (only the single file is served)
        run: mkdir -p dist && cp index.html dist/
      - name: Ensure the Pages project exists (the first run creates it)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project create aeterna-experiment --production-branch=main || echo "Pages project already exists"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aeterna-experiment
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
