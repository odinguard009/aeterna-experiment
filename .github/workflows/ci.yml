# Runs on every push and pull request: build check, lint, unit + property tests (headless Chromium).
# The Python Playwright regression (tests/run_all.py) stays a release step in Claude's workspace (see CLAUDE.md).
name: CI
# Actions minutes: run on main only, skip docs-only commits, cancel superseded runs (2026-10-17).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '.claude/**']
  workflow_dispatch:
  # v0.106.0: a nightly run on main. Pushes do not start this workflow in this repository (see the
  # note in release.yml), so without a schedule `main` is only tested when a session dispatches it.
  schedule:
    - cron: '23 19 * * *'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev tools (Playwright + TypeScript only; TypeScript pinned to the version the type baseline was counted with; ws runs the M6 server clients test)
        run: npm install --no-save playwright typescript@6.0.3 ws@8 && npx playwright install --with-deps chromium
      - name: index.html is the build of its sources
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Effect format (schema + shipped and staged cards; staged errors only reported)
        run: node tools/fx_validate.mjs --staged
      - name: Engine coverage ratchet (V8 coverage over the smoke flows, ~20 s)
        run: npm run -s coverage:check
      - name: Unit and property tests
        run: npm test
  # v0.106.0 (roadmap M7 step 2): the live half of the database work. The schema, the migration
  # runner and the Postgres binding of the store are exercised here, because `pg` and a server only
  # exist in CI (the plan keeps npm installs out of the sessions). tests/unit/server_store_pg.test.mjs
  # skips itself when DATABASE_URL is absent, so this job is the only place it runs.
  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aeterna
          POSTGRES_PASSWORD: aeterna
          POSTGRES_DB: aeterna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeterna -d aeterna"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://aeterna:aeterna@localhost:5432/aeterna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Postgres client for the tests
        run: npm install --no-save pg@8
      - name: Apply the migrations with the repository runner
        run: sh db/migrate.sh
      - name: The runner is idempotent (a second run applies nothing)
        run: sh db/migrate.sh
      - name: Store contract against Postgres
        run: node --test tests/unit/server_store_pg.test.mjs
