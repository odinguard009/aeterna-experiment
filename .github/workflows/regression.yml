# Full Python Playwright regression (the release gate), run on GitHub instead of in Claude's session.
# Triggers: "Run workflow" (Claude starts it through the REST dispatch API when tools/regression_due.sh says DUE), a release tag
# pushed by the user, and a weekly scheduled run (Sunday 03:17 WIB, 30 sims + 20 fuzz) as the safety net for sessions that skip it
# (process cleanup, owner 2026-10-19). The 5 Python parts and the fuzz job run in parallel.
# Claude checks the result with: gh api repos/odinguard009/aeterna-experiment/actions/runs?per_page=3
name: Regression
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 20 * * 6'
  workflow_dispatch:
    inputs:
      sims:
        description: CPU-vs-CPU games in the sims part
        default: '30'
      fuzz:
        description: Fuzzed CPU-vs-CPU matches in the fuzz part (random legal choices, tools/fuzz.mjs); 0 skips it
        default: '20'
jobs:
  part:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: ['1', '2', '3', 'legacy', 'sims']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (Python)
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Paths the suites expect
        run: sudo mkdir -p /mnt/user-data/outputs && sudo chown -R "$USER" /mnt/user-data
      - name: Fixtures
        run: python3 tests/make_fixtures.py
      - name: Run part ${{ matrix.part }}
        # failing lines become annotations, readable through the REST API (Claude cannot download raw logs)
        run: |
          python3 tests/run_all.py --part ${{ matrix.part }} --sims ${{ github.event.inputs.sims || '30' }} > run.log 2>&1 && { tail -1 run.log; exit 0; }
          grep -vE "^ok " run.log | grep -v "^\s*$" | head -25 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-400)"; done
          exit 1
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-${{ matrix.part }}
          path: tests/last-run.json
          if-no-files-found: ignore
  # v0.59.8 (F1): match fuzzer, Node + Playwright, alongside the 5 Python parts. Seed = run id, so every run plays new matches
  # and the log names mode + seed of a failure (fuzzOne(seed, mode) replays it exactly). Workflows do not commit: a failing
  # case JSON is uploaded as artifact fuzz-cases; the next session commits it to tests/fuzz-cases/ and fixes it first.
  fuzz:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.fuzz != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev tools (Playwright only)
        run: npm ci && npx playwright install --with-deps chromium
      - name: Fuzzed matches
        run: |
          n="${{ github.event.inputs.fuzz || '20' }}"
          node tools/fuzz.mjs --runs "$n" --seed "$(( ${{ github.run_id }} % 1000000000 ))" > fuzz.log 2>&1 && { tail -1 fuzz.log; exit 0; }
          grep -E "^\[fuzz\] (v|[0-9]+/[0-9]+ .*: [^o]|saved)|healthy|^[a-z]+ [0-9]+: " fuzz.log | head -25 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-400)"; done
          tail -5 fuzz.log
          exit 1
      - name: Keep new fuzz cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-cases
          path: tests/fuzz-cases/*.json
          if-no-files-found: ignore
  # v0.102.0: CPU benchmark (tools/cpu_bench.mjs): 240 CPU-vs-CPU matches with the ten Standard starters on the headless engine
  # (Node only, ~2-3 min), compared with docs/reports/cpu-bench.json. FAIL (more errors or timeouts) fails the job; WARN lines
  # (more passive turns, longer games, a style losing win rate) become warnings for the next session to read.
  cpu-bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CPU benchmark against the baseline
        run: |
          node tools/cpu_bench.mjs --check > bench.log 2>&1; code=$?
          cat bench.log
          grep -E "^WARN " bench.log | while IFS= read -r l; do echo "::warning::$l"; done
          grep -E "^FAIL " bench.log | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
