<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading</title>
<style>
:root{--bg:#0d1015;--teal:#17b897;--mint:#9fe8d8;--ink:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
#loader{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:28px;background:radial-gradient(ellipse at 50% 42%,#14221f 0,var(--bg) 62%);transition:opacity .6s ease,visibility .6s}
#loader.done{opacity:0;visibility:hidden}
svg{width:min(86vw,62vh,560px);height:auto;overflow:visible}
svg .ticks,svg .sun,svg .pillar,svg .nuki,svg .stub,svg .kasa,svg .tip,svg .pop{transform-box:fill-box}
.ring{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.65,0,.35,1) .1s forwards,glow 3.2s ease-in-out 1.6s infinite}
.ring2{opacity:0;animation:fade .8s ease .9s forwards}
.ticks{opacity:0;transform-origin:center;animation:fade .9s ease 1s forwards}
.core{opacity:0;animation:fade 1s ease .6s forwards}
.sun{opacity:0;transform-origin:center;animation:fade 1s ease 1.8s forwards,breathe 3.6s ease-in-out 2.8s infinite}
.pillar{transform-origin:50% 100%;transform:scaleY(0);animation:rise .7s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
.pillar.b{animation-delay:1.25s}
.nuki{transform-origin:center;transform:scaleX(0);animation:grow .5s ease-out 1.75s forwards}
.stub{transform-origin:50% 100%;transform:scaleY(0);animation:rise .3s ease-out 2s forwards}
.kasa{opacity:0;transform:translateY(-34px);animation:drop .7s cubic-bezier(.2,.9,.25,1.1) 2s forwards}
.tip{opacity:0;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1) 2.5s forwards}
.pop{opacity:0;transform-origin:center;transform:scale(0);animation:pop .6s cubic-bezier(.2,1.5,.4,1) calc(2.3s + var(--i)*.14s) forwards,flash 3.6s ease-in-out calc(3.4s + var(--i)*.5s) infinite}
.scan{opacity:0;animation:fade .8s ease 2.4s forwards}
.bar{width:min(60vw,240px);height:3px;border-radius:3px;background:#ffffff14;overflow:hidden;opacity:0;animation:fade .6s ease 2.2s forwards}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--mint));transition:transform .35s ease}
.bar.indet i{width:38%;transform:none;animation:slide 1.4s ease-in-out infinite}
.lbl{font-size:11px;letter-spacing:.42em;text-indent:.42em;font-weight:600;color:#9fb3ad;text-transform:uppercase;opacity:0;animation:fade .6s ease 2.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes rise{to{transform:scaleY(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes pop{60%{opacity:1}to{opacity:1;transform:scale(1)}}
@keyframes glow{50%{filter:drop-shadow(0 0 8px #17b897aa)}}
@keyframes breathe{50%{opacity:.55;transform:scale(1.12)}}
@keyframes flash{0%,88%,100%{filter:none}94%{filter:brightness(1.5) drop-shadow(0 0 6px #fff8)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(265%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.bar.indet i{animation:none;width:100%}}
</style></head><body>

</div>
<script>
// API: AeternaLoader.setProgress(0..1) switches to determinate; AeternaLoader.hide() fades out and removes.
window.AeternaLoader=(function(){var l=document.getElementById('loader'),b=document.getElementById('bar'),f=document.getElementById('fill');
return{setProgress:function(p){b.classList.remove('indet');f.style.transform='scaleX('+Math.max(0,Math.min(1,p))+')'},
hide:function(){l.classList.add('done');setTimeout(function(){l.remove()},700)}}})();
</script>
